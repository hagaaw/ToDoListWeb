<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="/css/log-in-page.css" rel="stylesheet">
</head>
<body>
  <main>
    <div id="header">
      <h2>Login</h2>
    </div>
    <div id="form">
      <form>
        <div class="input" id="email">
          <label>
            <input type="email" name="email" placeholder="Enter your email">
          </label>
        </div>
        <div id="password" class="input" >
          <label>
            <input type="password" name="password" placeholder="Enter your password">
          </label>
        </div>
        <div id="log-in">
          <input type="submit" value="Log in">
        </div>
      </form>
      <div id="to-log-in">
        Dont have an account? <a href="/registration">Sign up</a>
      </div>
    </div>
  </main>
</body>
</html>
